name: Bug
description: Defecto encontrado durante la ejecución de pruebas
labels: ["bug"]
body:
  - type: input
    id: titulo
    attributes:
      label: Resumen
      description: "[Módulo] Qué falla, en una línea"
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options:
        - Blocker
        - Major
        - Minor
    validations:
      required: true
  - type: input
    id: usuario
    attributes:
      label: Usuario de prueba
      description: standard_user, problem_user, etc.
    validations:
      required: true
  - type: input
    id: referencias
    attributes:
      label: Requisito y caso de prueba
      description: "Ej.: RF-CHK-10 / CHK-09"
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: real
    attributes:
      label: Resultado real
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Capturas, texto exacto del mensaje, peticiones de red relevantes
  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Navegador, versión y resolución
