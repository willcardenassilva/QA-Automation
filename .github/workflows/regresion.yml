name: Regresión completa semanal

on:
  # Los lunes a las 13:00 UTC (10:00 en Argentina/Chile). El horario de GitHub es siempre UTC.
  schedule:
    - cron: '0 13 * * 1'
  # Permite ejecutarla a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regresion:
    name: Regresión completa (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Ejecutar todos los tests
        run: npm test

      - name: Guardar el informe
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: informe-regresion
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore
